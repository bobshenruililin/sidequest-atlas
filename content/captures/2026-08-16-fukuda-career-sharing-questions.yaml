title: Fukuda 28 Aug GHD career sharing — questions worth asking
rawText: "Sharing on a career in global health and development. Speaker:
  Professor Keiji Fukuda, Honorary Professor, School of Public Health. Date:
  August 28, 2026 (Friday). Time: 2:30pm – 4:30pm. Venue: LE2, Library Extension
  Building, LG1/F, Main Campus, University of Hong Kong. Are there any questions
  you wish to discuss at the sharing? Research in deep and think in deep. Give
  me a list to choose from."
spark: Fukuda invented GHD. Ask what a non-physician can own in a CHP/IHR room,
  and whether a national health-security year beats a WHO intern badge. Do not
  ask how to get into WHO.
