triangulation:
  againstCanon:
    - Compounding over speed; triangulate do not twin
    - Medicine closed; ordinary law floor; grey door closed; JD after UG only if
      asked
    - Atlas is router not career dump; My-Life owns Career OS; LearnAI owns
      public radar
    - One deep placement plus LiA, not three logos (keep the rule, apply it to
      Future B itself)
    - T&N thesis is HK affection plus China competence enacted through work
    - Nordics fieldwork through 20 Aug 2026 — do not eat the last trip days
  informationGaps:
    - T&N award-letter clauses (concurrent Laidlaw, GPA renewal, Endeavour year,
      LINK-S as Mainland exchange)
    - Laidlaw LiA 2027 exact dates and makesense track
    - LINK-S 2026/27 immersion dates, Shanghai vs HCMC, enrolment vs intention
    - APRU GHC late-poster policy after 15 Aug 2026 deadline
    - What the heat-health team can claim (life tables vs HA admissions)
    - HKSAR PR is implied by T&N eligibility but not proven in this session
  opportunityGaps:
    - Named Seam Ready Endeavour proposal with a real problem owner
    - LearnAI HK/GBA first-year-accessible opportunity ledger
    - Host-owned six-week public-interest projects instead of explorer theatre
    - GHD six-month capstone politics starting 2027 (China CDC Shanghai has blog
      precedent)
    - Term-time Sau Po / second-faculty (Chao Ren) letters
  falseBargains:
    - Cloning US CS underclassmen lists (visa, URM, SWE interviews, summer 2027
      already sold)
    - Zapply autofill and ambassador programmes as signal
    - Jane Street Dec-Feb HK intern plus Cleary winter VS on top of LINK-S and
      October talks
    - My-Life student_profile still saying Govt&Laws LLB transfer
    - Mitacs Globalink 2027 (IAO 26 Aug 2026) colliding with LiA
    - Treating Summer 2028 as an open internship summer (it is GHAD4010)
    - WHO internship as a 2026 action (three-year plus age-20 gates)
    - Vanity HK explorer conference without a host brief
    - Claiming HA data or a China CDC offer
