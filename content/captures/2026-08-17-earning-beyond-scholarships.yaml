title: Earning beyond scholarships — MoveOps locked as a disclosed HK
  domestic-move coordinator (paperwork, not labour)
rawText: "Re-plan how to earn money beyond scholarships. Do not be restricted by
  profile; go crazy. Thinking of helping people move houses. Include automation.
  Legal only; grey door stays closed. Prior 24 July chat triage had MoveOps HK
  (audit, packing, coordination while insured movers own transport; automate
  quote to invoice to review; sell QuoteOps later) with a 48-hour weekend
  launch. Parallel same-day pass 2026-08-17-moveops-cash-stack pushed Helsinki
  presell, packing sprints, and a 10-customer energy. Operator-of-record after
  the 17 Aug locked plan (Opus 5 + Fable 5 + Sol 5.6; Kimi K3 unavailable): this
  is not a cash emergency. Rank by skill residue and optionality per hour.
  MoveOps survives as the number-one non-scholarship experiment only as a
  disclosed Hong Kong domestic-move coordinator. The customer contracts and pays
  a licensed, insured mover. Bob sells inventory, like-for-like quotes,
  building-rule verification, and origin/destination condition packets. He does
  not own a van, employ a crew, hold goods/keys/deposits, or carry anything
  across the boundary. As of 24 Aug 2026 encode, Helsinki week (17-21 Aug) is
  closed; remaining live sequence is landing interviews, private gate-zero, then
  at most two September doc-packet pilots."
spark: The moving idea is right and the July shape is wrong. Employer liability,
  not demand, is the binding constraint. The sellable unit is the documented
  move packet. Chat without a CaptureRecord is why the 24 July 48-hour weekend
  launch decayed; it was calendar-illegal at birth, not merely stale.
