      not an app. No new repo. Paper plus scripts in private scratch."
    - "QuoteOps / TradeOps: templates or done-for-you install after two paying
      trade users. No multi-tenant SaaS, no auto-send."
    - "Parked crazy-bench SKUs until two pilots exist (not a second company): QR
      box biographies, narrated handover walkthroughs, overweight-luggage
      triage, Carousell consignment without taking title, licensed-only
      gap-night coordination, bilingual HK-Mainland prep (manifests plus
      licensed forwarder RFQ, never carriage)."
    - "Fastest compliant HKD if MoveOps stalls: on-campus lab or department
      hours (reference-generating), not a fifth prestige funnel. EN-ZH editing /
      grant-submission ops for HK researchers is the other clean contract-labour
      lane."
  falseBargains:
    - Helsinki presell and campus spam from Finland (UEMO plus field-day theft).
      Silence was locked. Journals first. That window is now closed; do not
      backfill a Helsinki grind.
    - Muscle-first packing sprints and a 10-customer-by-week-6 kill floor. Those
      two together create pressure to hire. Labour sits with insured movers.
    - The 24 July 48-hour weekend launch — calendar-illegal at birth (about to
      be abroad, then walk into term). Chat without a CaptureRecord is why it
      decayed.
    - Endeavour for MoveOps. Domestic HK concierge is not obviously GBA/Mainland
      start-up. False bargain. Seam Ready stays the named T&N conversion.
      Preflight in writing; do not reshape MoveOps to fit the fund.
    - New moveops repo, or treating paid move jobs as housing-tour-kit /
      flatfield activation. Tour diligence is not move evidence. No new repo
      until a later separate gate. Atlas board only until validation.
    - QuoteOps as multi-tenant SaaS (auth, payments, support queue a student
      with October conferences and winter LINK cannot staff). Templates after
      two paying trade users, never auto-send.
    - Publishing immigration status, or inferring right of abode from T&N
      eligibility plus awarded status as a Pages fact. Confirm once in private.
    - I'll-do-whatever without floors. Van-first. Uninsured friends. Self-held
      escrow. Cross-border carriage. Unlicensed short-stay. Both-sides of one
      tenancy. Unlicensed estate agency. Fully-insured without reading the
      policy. Passengers in goods vans. HA-data or China CDC offer claims.
      MoveOps/Seam Ready fusion. Jane Street winter. Australia WHV. ArtIntel
      founder packet. AWS evangelism. Paid LearnAI radar. Summer-storage
      brokerage whose season is LiA/capstone. Family-purchased revenue counted
      as validation. Undisclosed mover referral fees beside a neutral
      three-quote comparison. Cash-in-hand no-BR operation.
