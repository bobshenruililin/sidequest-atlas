triangulation:
  againstCanon:
    - Compounding over speed. Abundance is optionality rate, so cash that buys
      no new option is a bad trade even when it clears.
    - Grey door closed 2026-07-22 and reaffirmed. No forgery, no undisclosed
      kickbacks, no cash-in-hand no-record operation. Carrying other people's
      goods across the HK/Mainland boundary is the same door wearing a moving
      blanket — MoveOps sells paper and pixels, never carriage.
    - Family capital is an advantage and a distortion field. Family purchases
      may be revenue but never validation. Do not overclaim need. This is not a
      cash emergency (public T&N award benefits plus family capital).
    - Housing-tour-kit venture framing killed 2026-07-22. MoveOps to QuoteOps
      multi-tenant SaaS is the same false bargain renamed. Tour diligence is not
      move evidence; shared photo-to-PDF patterns later, separate gates.
    - October London plus Valencia, winter LINK-S, summer 2027 LiA, summer 2028
      GHD capstone, and the 1 Sep term / 1-15 Sep add-drop window are already
      sold. Atlas hosts the board and the capture; products get their own homes
      (2026-08-16-one-brain-not-one-repo). Seam Ready stays the named T&N
      conversion. Never merge MoveOps with Seam Ready.
    - "16 Aug gameplan (IDs 2026-08-16-underclassmen-lists-career-gameplan and
      2026-08-16-one-brain-not-one-repo, YAML may live on
      cursor/scholar-career-gameplan-92c4): stay GHD plus CS minor; GLaw
      transfer closed in writing; max two career emails from Helsinki (APRU
      late-poster; Horizons LiA/T&N). Helsinki MoveOps grind was forbidden then
      and is not to be backfilled now."
  informationGaps:
    - GATE ZERO is a private Bob checklist, not a Pages fact. Read the award
      letter for any outside-work or outside-business clause, GPA renewal bar,
      and Endeavour year — all UNCERTAIN until read. Confirm right-to-earn once
      in private. Do not publish immigration or visa status. Do not infer
      permanent residency from T&N eligibility text.
    - "Business Registration Ordinance s.5 / IRD: registration is due within one
      month AFTER commencement; BR is not a licence to trade and cures no other
      licensing requirement. Exact current fee, levy, and penalty figures
      UNCERTAIN — verify on IRD, do not invent."
    - "Employees' Compensation Ordinance s.40 (Labour Dept concise guide and
      FAQ): every employee, including one-day and part-time, needs EC insurance
      in force first. Commonly cited minimum cover is not less than $100 million
      per event for employers of 200 or fewer; failure is prosecutable (commonly
      cited maximum $100,000 and two years). Verify current amounts from Labour
      Dept primary text before any helper."
    - "Estate Agents Ordinance s.15 / EAA licensing: proxy viewing, introducing
      a tenant or buyer, or negotiating acquisition or disposition stays blocked
      until an EAA answer is in writing. Handover evidence for an existing
      client's own move is not automatically that — UNCERTAIN, get the written
      answer before landlord-facing paid work."
    - Hotel and Guesthouse Accommodation Ordinance / licensed short-stay
      threshold (commonly stated as licences below 28 consecutive days) —
      UNCERTAIN exact scope. Do not sell gap-night coordination until verified.
    - Peak Hong Kong moving season, hall check-in dates, and summer-storage
      redelivery windows are UNCERTAIN. Verify against official hall notices and
      mover conversations; do not assume late August is peak.
    - Willingness to pay for a documented move packet is UNCERTAIN — the two
      September pilots exist to test exactly this. No invented prices.
    - Whether a domestic HK concierge is in Endeavour scope — ask in writing;
      expect no. Do not reshape MoveOps to fit the fund.
    - Education Ordinance registration thresholds for any group tutoring format
      — UNCERTAIN, verify before any group format.
    - My-Life student_profile still carries a GLaw ghost (sister repo; not this
      PR). Vault life-canon journals were empty at 17 Aug capture. T&N
      acceptance email is not asserted.
