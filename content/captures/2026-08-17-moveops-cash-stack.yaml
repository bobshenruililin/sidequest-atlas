title: MoveOps 90-day cash stack — plan again, weirder, no van
rawText: "Bob (from Helsinki, 3 field days left, flying HK 20-21 Aug): PLAN
  AGAIN how to earn money. Legal only, grey door stays closed. Do not box me
  with prestige/CHP purity — I want crazy + house-moving + automation. Housing
  venture is dead; moving-house HELP is the new spark. Prior Sol MoveOps model:
  no van; sell photo audits, packing sprints, coordination, handover evidence;
  automate the ops loop; productize QuoteOps. I'll do whatever."
spark: Landing 21-22 Aug drops him into peak hall move-in /
  summer-storage-return / end-of-August landlord-handover churn — the one week a
  no-van operator selling evidence, sprints, and coordination can start with
  zero capital.
