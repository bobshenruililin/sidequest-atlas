title: GHD exchange review — HKUWW as tool, not prestige ladder
rawText: Adversarial review of whether UChicago / Columbia / LSE / Todai are the
  right tools for GHD coursework transfer, public-health letters, T&N China
  commitment, later MPH/MPhil/JD optionality, and AFLSP-style East Asian
  networks. Verified against the HKUWW 2026-27 institution list (11 Mar 2026),
  BASc(GHD) regulations and syllabus, HKU Credit Accumulation and Transfer
  Policy, LSE General Course regulations, UTokyo USTEP, UBC SPPH calendar,
  BXAI/AFLSP pages, JIHS, and HKU Worldwide Plus Visiting. Comparison set was
  wrong before criteria were applied. Full findings in
  docs/exchange-review-ghd-hkuww.md.
spark: "The binding constraint is not prestige but calendar collision: GHAD4010
  capstone normally runs Year 3 Summer to end of Year 4 Semester 1, with Year 3
  course GHAD3001 as prerequisite, while every full-year option (LSE, Todai,
  Oxford) requires two completed years and therefore lands on Year 3. A full
  year is purchased with the China CDC placement window."
