title: HKUWW 2027/28 premier exchange primer
rawText: "Research HKUWW premier partners for 2027/28 (apply Oct–Dec 2026).
  Named set: UChicago, Columbia, LSE, UTokyo, Waseda, Kyoto; Mainland
  PKU/Fudan/Tsinghua for Tung & Ngai compulsory exchange and AFPLA. T&N covers
  HKU local tuition so US/UK sticker is the wedge. One IAO slot. Two equal
  stacks: premier overseas year vs PKU/Fudan semester. Primer at
  docs/hkuww-exchange-primer.md."
spark: Chicago-at-HKU-fees is a real tuition steal (~HK$0.5M wedge) but not the
  only full-year elite, not free of living costs, and not a public-health
  degree. Columbia is semester-only. Oxford visiting is fee-paying. PKU SPH/HSC
  is blocked on standard HKUWW. T&N Mainland may be satisfiable without burning
  the slot — confirm in writing.
