triangulation:
  againstCanon:
    - Compounding over prestige appearance; optionality rate; T&N China
      commitment is binding
    - Medicine closed — GHD is not MBBS; do not plan clinical PKU
    - Grey-door closed — no unofficial access coaching for AFPLA or host courses
    - Family capital is an advantage and a distortion — Chicago living is not
      "free"
  informationGaps:
    - 2027/28 partner PDF not yet published; Oct 2025 is a proxy
    - Whether LINK or China Vision summer satisfies T&N compulsory Mainland
      exchange
    - Whether GHD applies under Medicine or Social Sciences faculty code
    - Whether AFPLA chapters admit inbound exchange students
    - Whether Chicago ISALs can actually register Harris / health-policy courses
    - Whether GHAD3001 can move so a Y3 full year does not slide the China CDC
      capstone window
  opportunityGaps:
    - Y2 application window 12 Oct–11 Dec 2026 with Y2+ priority
    - LSE as subject-aligned full-year alternative to Chicago
    - UBC as GHD-walked credit-transfer path
    - Non-HKUWW Mainland path to preserve the one slot for a premier year
  falseBargains:
    - Worldwide Plus Oxford visiting (pay £41k–54k) versus Chicago/LSE exchange
    - Treating Columbia as a full year
    - Spending HKUWW on PKU to 'join AFPLA' as if it were a programme
    - Assuming PKU semester equals SPH/China CDC training
    - Calling Chicago 'free undergraduate education' while OOP living is
      ~HK$0.25M
  corrections:
    - Chicago is not the only full-year elite (LSE, Durham, Todai, Kyoto,
      Waseda, Osaka)
    - March 2026 PDF is leftover spots; do not plan from it
    - UTokyo tuition wedge is near zero; the year is not a money steal
    - GHD capstone is a second overseas block and cannot replace HKUWW or vice
      versa
  suggestedImplementations:
