title: Find a dining companion in Hong Kong during Restaurant Week
rawText: How do I find someone to eat great food with me in HK? Dining city have
  its restaurant week. Any groups?
spark: Wants a table-mate for Hong Kong Restaurant Week, framed as great food
  plus company. DiningCity is a booking promo, not a matching club;
  stranger-dining groups optimize for filling chairs, not for taste.
