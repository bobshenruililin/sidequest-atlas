title: Winter 2026/27 LINK-S and Recognised Programmes primer
rawText: Spend winter 2026/27 either at LINK-S or any winter programme on IAO
  Recognised Programmes (last updated 21 May 2026). Maximise experience,
  meaningfulness, and memory. Loved NEWDAY. Shanghai is home (grandparents) but
  much of the world unseen. Review every opportunity with verdicts. Window 24
  Dec 2026–17 Jan 2027. Primer at docs/winter-2026-27-primer.md.
spark: NEWDAY cannot be bought in winter. LINK-S is the structurally winning HKU
  course (12 credits, subsidy, grandparents, dates). World-not-seen fits that
  actually calendar-fit are Hanyang Session A, Vilnius language, and HUWISU Term
  1. Tübingen/Lille are the NEWDAY cousins and their dates lose. Do not spend
  SSE on three weeks. Confirm HKUWW criterion 3 in writing before 4 Sep
  enrolment.
