triangulation:
  againstCanon:
    - Compounding over speed; timestamped records; do not invent fees or hours
    - NEWDAY DNA is residential dialogue, not a SKY credit mill
    - Shanghai family is traveler-provided context, not identity drama
    - One SSE per UG; do not spend it on a 3-week trip
    - HKUWW slot is once; short-term should not burn it — confirm in writing
  informationGaps:
    - Whether LINK engages HKUWW criterion 3 (IAO goabroad inbox)
    - Whether HKUWW interviews can be video from Shanghai
    - Whether LINK-S satisfies T&N compulsory Mainland / draws on HK$80k
    - 2026-27 MES window (China Vision page still showed 2025-26)
    - Hanyang 1 Sep 2026 fee sheet and intern KRW
    - Whether HKU is a partner for HIWS/KU/Yonsei winter discounts
    - HUWISU and Vilnius housing for early January
    - NEWDAY 2027 dates (unpublished)
  opportunityGaps:
    - LINK Round 2 closes 4 Sep 2026 23:59
    - Hanyang Session A 26 Dec–9 Jan as first-Korea fit
    - Vilnius 4–15 Jan as only small-Europe complete fit
    - HUWISU Term 1 4–15 Jan as GHD-adjacent Berlin seminar
    - Tübingen T-IES as NEWDAY cousin if Sem 2 window ever moves
  falseBargains:
    - Treating Fudan winter as a substitute for LINK-S
    - Spending SSE on a 3-week winter school
    - LINK-V June as a winter substitute (collides with LiA)
    - Yonsei/KU as clean fits when 22 Dec is a full teaching day
    - TFAS Santiago as unseen-world while LiA already spends the Americas
    - Shopping for a winter NEWDAY
  corrections:
    - Official name is LINK with tracks LINK-S and LINK-V
    - Most European winter schools begin after 17 Jan 2027
    - HUWISU Term 1 (4–15 Jan) fits; Term 2 does not
    - Hanyang Session B year string is internally inconsistent
    - IAO Recognised list is a reference, not an exchange offer
