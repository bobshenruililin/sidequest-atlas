title: Winter 2026/27 dossier fact sheets plus Chile craving
rawText: Follow-up to the winter primer. Commissioned-standard one-page fact
  sheets with insights (scene, thesis, specs, non-brochure insight, memory,
  degree cost, verdict). Later craving for Chile, 1-2 weeks of nature before a
  winter school, ballpark expense, train versus car. Do not invent fares.
spark: High NEWDAY-likeness and high calendar-fit still do not occur together.
  LINK-S remains the default. Chile-the-landscape is not TFAS-the-seminar and is
  not LiA Medellin or Mexico City. One Chilean region can fit the window; the
  rest of the country cannot. Long-haul is the unpublished dominant cost. Do not
  spend SSE.
