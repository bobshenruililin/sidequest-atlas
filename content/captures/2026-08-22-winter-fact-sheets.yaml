title: Winter 2026/27 dossier fact sheets plus Chile craving
rawText: Follow-up to the winter primer. Commissioned-standard one-page fact
  sheets with insights. Chile craving (nature before a winter school, trains vs
  car, ballpark without inventing fares). Then CAES9922 clash with LINK-S;
  traveler decided LINK-S and will try another subclass.
spark: Traveler decided LINK-S. CAES9922 is a 6-credit English-in-the-Discipline
  course; UG 5 requires an ED for graduation; GHD maps it to Year 2. Clash with
  LINK is timetable/subclass, not a reason for Chile or Fudan.
  Chile-the-landscape is not TFAS. Do not spend SSE.
