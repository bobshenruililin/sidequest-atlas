triangulation:
  againstCanon:
    - Compounding over speed; timestamped records; do not invent fees or hours
    - NEWDAY DNA is residential dialogue, not a hotel cohort or SKY mill
    - Shanghai family is traveler-provided context, not identity drama
    - One SSE per UG; do not spend it on a 3-week trip or a Chile prologue
    - Do not twin prestige, hemispheres, or programmes that share only a
      mechanism
  informationGaps:
    - Whether LINK engages HKUWW criterion 3
    - Whether HKUWW interviews can be video from Shanghai
    - Whether LINK-S satisfies T and N compulsory Mainland / draws on the shared
      cap
    - 2026-27 MES window
    - Hanyang 1 Sep 2026 fee sheet
    - January 2027 HKG-SCL fares (unpublished; do not quote aggregator snapshots)
    - Torres del Paine January 2027 camp availability on Vertice and Las Torres
    - Live CONAF category/price on pasesparques for a foreign adult in Jan 2027
    - NEWDAY 2027 dates
  opportunityGaps:
    - LINK Round 2 closes 4 Sep 2026 23:59
    - Nature-only Chile inside 24 Dec 2026-17 Jan 2027 if first-Chile is a
      written exception
    - Hanyang Session A, Vilnius, HUWISU Term 1 as named first-ness alternates
    - Tübingen as named cousin if a later January opens
  falseBargains:
    - Treating TFAS as the way to see Chilean nature
    - Treating LiA Colombia/Mexico as a substitute for Atacama or Patagonia
    - Trying to see the rest of Chile in ten days before TFAS
    - Using EFE as a country-crossing rail network
    - Spending SSE on winter or on Chile
    - Fudan winter as a substitute for LINK-S
    - Shopping for a winter NEWDAY
  corrections:
    - LiA does not scratch a Chile landscape craving; it still competes for
      Americas attention and money
    - TFAS copied a residential-cohort mechanism into a classical-liberal house
    - Park tariff page labels are internally inconsistent; buy only via the live
      CONAF form
    - SKY public from-prices seen in March dates are not January quotes
    - No passenger train to Calama or Punta Arenas
