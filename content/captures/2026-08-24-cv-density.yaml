title: Dense one-page Youde CV — honest T&N ceiling, not a 500k lump
rawText: Bob said the 23 Aug one-page Youde CV was too empty, too little per
  item, and nothing caught the eye. Rebuild for a human first pass and ATS.
  Include Tung and Ngai 1 of 4 at HKU and 500k HKD cumulative if those can be
  sourced honestly; NEWDAY 1 of 3 HKU plus 14-plus days Nordic; Wu Zhi Qiao 1 of
  3 coordinators. Triangulate Silicon Valley VC, HK trading house, NYC prop
  shop. Do not invent. Do not print secrets. Stay on the CV, not a new
  scholarship scout.
spark: A sparse one-page CV wastes Tung and Ngai, Laidlaw plus Bishai, Martin,
  WZQ coordinator, and NEWDAY. Density with true numbers; refuse a fake 500k
  cheque.
