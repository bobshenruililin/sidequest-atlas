triangulation:
  againstCanon:
    - Never invent dates, GPAs, hours, or award lumps
    - Tung and Ngai official benefits are full tuition for the duration of the
      scholarship, living HK$40,000 per year, exchange subsidy max HK$80,000
      shared across one Mainland plus optional international, Endeavour up to
      HK$100,000 once
    - Four-year package ceiling is arithmetic around HK$518,000 to HK$525,500,
      not a Foundation slogan and not a Year-1 disbursement
    - NEWDAY official dates 29 Jul-6 Aug 2026 are nine days; 14-plus Nordic days
      require naming the 6-20 Aug Oslo-Stockholm-Helsinki atlas trip separately
    - Wu Zhi Qiao is Student Coordinator, Macha, May-Jun 2026, not a generic
      volunteer
    - GEST Valencia invited speaker and Laidlaw London attending, Oct 2026
    - CGPA 4.09/4.30 current operator-stated; 4.24 is dead; no CS minor
    - Grey-door closed
  informationGaps:
    - CGPA not checked against an SIS transcript in this session
    - Independent source for 1 of 4 HKU Tung and Ngai awards this cohort
    - Independent source for 1 of 3 HKU NEWDAY seats in 2026
    - Independent source for 1 of 3 WZQ coordinators
    - Whether HKU composition fee is locked at the 2025-26 rate
    - GEST invitation letter still not in git
    - Official Martin letter wording
  opportunityGaps:
    - Youde local nomination still needs this one-page PDF attached
    - Honest T&N ceiling plus selection ratios is the three-second scan
  falseBargains:
    - Printing HK$500,000 as if a cheque already cleared in Year 1
    - Inflating NEWDAY from nine days to 14-plus
    - Using Horizons 2024 three-seat copy as 2026 proof
    - Listing MIT Hong Kong Innovation Node as Cambridge, MA
    - Two-page CV for a Youde first attachment
    - Inventing volunteer hours or a CS minor
    - Claiming fluent Cantonese when canon says scripts are still required
    - World Health Summit without a confirm
  corrections:
    - 23 Aug CV was fact-true and still too empty; density is the job
    - 500k is the right order of magnitude for a four-year ceiling with maxima
      drawn, and the wrong object if written as a received lump
    - Nordic 14-plus is academy plus independent fieldwork, two named objects
    - 1 of 4 / 1 of 3 / 1 of 3 are operator-stated this session, not
      Foundation-page facts
