title: Trim CV skills, add Cantonese, drop Horizons trip and T&N ceiling clause
rawText: Overall okay. Languages are Cantonese, Mandarin, and English. Tools and
  skills are too extensive; keep most in-demand ones. I can do R, C++, Python,
  and I learn fast. Great researcher. Delete the HKU Horizons line, make Young
  Writers a new line, and drop the extensive not-one-single-reimbursement
  language for Tung and Ngai. Others are all good.
spark: The dense CV over-explained T&N money and dumped Qiskit/GraphCast onto
  skills. Bob wants a short demand stack and spoken languages including
  Cantonese.
