triangulation:
  againstCanon:
    - Compounding over speed; triangulate, do not twin
    - Grey-door closed; never invent hours, hardship, awards, or deadlines
    - Family capital is an advantage and a distortion field — do not perform need
    - Tung and Ngai already awarded; do not hide it, rewrite the PS, or package
      a lump
    - Thesis is heat-health at the HK–Mainland seam; Q29/Q30 buy hours, not a
      second identity
    - Stay in BASc Global Health and Development; CS minor stays N/A until SIS
    - Youde local nomination is a separate door; Youde overseas is leaving HKU
  informationGaps:
    - General Round Year-2 deadline remains portal-only as of 24 Aug 2026
    - Tung and Ngai concurrent-award clause unread; letter only
    - Official title of the listed HK$16,000 award
    - Volunteer hour sum until certificates are counted
    - Whether Martin paper says Scholarship, Prize, or Scholar
    - Whether Laidlaw letter is stipend-only or also names LiA travel
  opportunityGaps:
    - One honest General Round form is the live HKU-administered door this week
    - Q12 from St John's residence, basketball, Laidlaw/Bishai, Laureate Forum
    - Q14 from Wu Zhi Qiao coordinator and Gannan Horizons with proof
    - Q29/Q30 as contiguous time versus tutoring, with a decline-if-forbidden
      clause
    - Same one-page CV for Youde; attach to General Round only if the portal asks
  falseBargains:
    - Mixing Youde overseas 4 Sep into Q33
    - Attaching a CV to General Round when the portal did not ask
    - Cloning Tung and Ngai PS scenes into money questions
    - Selecting more than 300 volunteer hours without a documented sum
    - Counting GEST, tutoring, NEWDAY, or Nordic travel as service
    - Printing 1 of N ratios, GEST calendar dates, or a Year-2 thesis
    - Asking a need-aware reader to subsidise prestige travel
    - Hiding Tung and Ngai or performing hardship
    - Declaring a CS minor before SIS
  corrections:
    - Published Tung and Ngai package is tuition plus living HK$40,000 plus
      overseas/Mainland max HK$80,000 plus Endeavour up to HK$100,000
    - Laidlaw is funded research, not an unpaid post
    - GEST Valencia invited speaker is October 2026, upcoming, not service
    - Q13 radio must equal the verified Q14 hour sum; default is a lower band
    - Identical facts across doors are required; identical prose is not
