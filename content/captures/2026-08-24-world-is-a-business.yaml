      for it, not the only school
    - Public intern taxonomy has no distinct Research Engineer intern; closest
      undergrad research seat in HK is QR intern; SWE intern is systems; ML
      intern is PhD/postdoc-shaped
    - A trader without P&L is junk; a scholar with only a reject email is the
