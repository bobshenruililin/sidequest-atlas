title: World is a business — P&L loop vs Jane Street costume
rawText: "If you care about the commercial value of a career, mindlessly choose
  Jane Street research engineer. Elite trading-firm training is scarce. It
  sounds metaphysical and is practical: find opportunity, catch it, size risk,
  take risk. A trader who does not make money is junk with extra halos. Later
  the world is one business. Edge is ability and instinct others lack. If you
  care more about the ocean of knowledge, ignore this. World is a business. Do a
  playbook on making money as Bob Shen."
spark: Steal Jane Street's P&L scoreboard, not the research-engineer costume;
  map live HK intern seats against LINK, LiA, and the PhD bar.
