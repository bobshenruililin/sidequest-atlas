triangulation:
  againstCanon:
    - Compounding over speed; chat without a CaptureRecord does not count
    - Never invent hours, fares, or live political facts; mark uncertainty
    - Prestige hunger is an advantage and a distortion; do not collect people
    - Grey-door closed; no scraped private contacts, no parliament cold-call
    - Medicine closed; GHD / public-health / evidence-for-service frame only
    - Ordinary law floor is acceptable; whistleblower comparative law is a real
      overlap without Magic Circle theater
    - Education money is a public or donor instrument, not a second identity
      (CEDARS capture); his loan-fund investigation is the harsh version
    - Calendar locks remain term start, October Laidlaw London plus GEST
      Valencia, winter LINK, summer 2027 Laidlaw LiA
    - Atlas hosts relationship records; it does not absorb a private dossier
      into Pages
    - Nordics 2026 Oslo fieldwork is not fake kinship with UWC Norway
  informationGaps:
    - Exact 2026 online-block dates and last day of Hong Kong residency
    - Whether Fellows receive library, sports, or health-service cards
    - Housing address (programme provides accommodation; do not hunt it)
    - Intro timing and what personal contact Joyce will share
    - English edition of From Hovd to Harvard (not verified)
    - Complete Unlock episode list and his current hosting role
    - HPAIR claim of Oxford / Columbia / Harvard Kennedy School executive
      education (secondary; unverified)
    - Dietary, family, language, and health needs
    - Oyu Tolgoi oversight status as of 25 Aug 2026
    - Whether ICAC Integrity Compliance Management System has been published by
      September 2026
  opportunityGaps:
    - Eight-week local research assistant for his whistleblower paper, if he
      wants it; Hong Kong is a useful negative case (no comprehensive statute)
    - Law Library walk and annotated HK ordinance / HKEX / ICAC bibliography
    - "Honest overlap: Unlock Outlive episodes with GHD; return-home after elite
      school; education loans versus scholarships"
    - Campus tour that actually reduces friction (Octopus, supermarket, bank,
      library access rule)
    - Cohort lunch is a room of mid-career public-policy people, not only one MP
  falseBargains:
    - Treating Student Ambassador as a CV line or "my mentor the MP"
    - Reciting the biography at the welcome lunch
    - Inner Mongolia lamb hotpot as a stand-in for independent Mongolia
    - Asking for WEF, HBS, or parliament introductions on day one
    - Journalisting Oyu Tolgoi or the loan-fund name lists
    - Fake-reading the Mongolian memoir
    - Using him in Youde, Tung and Ngai, or General Round copy
    - Hoarding first-come AGF event slots then disappearing to London and
      Valencia in October
    - Cold-contacting LinkedIn or parliament before Joyce's introduction
    - Performing Naadam trivia or unsustainable Mongolian greetings
    - Collapsing Unlock into a solo brand when public listings show co-founders
      and other hosts
  corrections:
    - Joyce said designated Fellow, not mentor; AGF about-page says Fellows
      mentor HKU undergraduates. Receive mentorship; do not demand it
    - Given name Batnairamdal, patronymic Otgonshar; nickname Nagi only after he
      offers it; do not copy HPAIR's Batnaramdal misspelling
    - 2026 AGF is ten weeks (two online, eight in Hong Kong and the region) from
      September to November; orientation for SAs is 21 Sep 2026 per Joyce, not
      an invented August start
    - The memoir is Mongolian (Nepko, 6 Oct 2023, 295 pages) per his own
      bibliographic note; AGF English title is From Hovd to Harvard
    - Hong Kong whistleblower protection is piecemeal across ordinances and
      listing-rule governance, not a single statute (IBA 2022; Chambers 2026)
    - Campus bank and supermarket hours conflict across HKU pages; the HR page
      last-review date is June 2021. Reverify on 21 Sep. Do not quote Saturday
      HSBC hours as fact
    - Urban Coffee Roaster at Main Library was listed as coming soon on 25 Aug
      2026; do not promise it on the tour
