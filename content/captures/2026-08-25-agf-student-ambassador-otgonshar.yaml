      rationale: First-come event registration plus a silent no-show is worse than a
        smaller honest availability window
      effort: S
      leverage: high
      owner: bob
    - action: If he wants research help, build a short annotated HK whistleblower
        packet from ordinances, HKEX comply-or-explain rules, and ICAC/SFC
        public channels; offer once, do not dump
      rationale: That is the AGF project; a GHD student with library access is useful
        here and is not a peer MP
      effort: M
      leverage: high
      owner: shared
    - action: On the tour, hit libraries, CYM supermarket, campus banks, and canteens;
        add Law Library on a later day; recheck hours the morning of the 21st
      rationale: Joyce named those stops; a sitting fellow needs friction removed, not
        a heritage lecture
      effort: S
      leverage: high
      owner: bob
    - action: Do not surprise-book Mongolian-themed dinner; if he asks, distinguish
        independent-Mongolia kitchens from Inner Mongolia lamb chains and
        reverify the venue the same day
      rationale: Ethnic hospitality without asking is a category error for a
        cosmopolitan MP; food hours are volatile
      effort: S
      leverage: medium
      owner: bob
    - action: Keep this record and docs/agf-sa-otgonshar-2026.md free of phones,
        personal emails, housing, and booking refs; wait for Joyce's
