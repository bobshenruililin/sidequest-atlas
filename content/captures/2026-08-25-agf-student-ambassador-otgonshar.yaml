title: AsiaGlobal Fellows student ambassador pairing is hosting work, not a
  collected mentor
rawText: >-
  Good news here. To onboard and really develop my relationship with my mentor,
  crawl all the info you know, books, other medias, so that I really learn
  something from him and really make him feel at home in HK.

  Dear Bob, Congratulations! You have been selected as one of our Student
  Ambassadors (SA) for the AsiaGlobal Fellows Program. Welcome aboard.

  Your designated AsiaGlobal Fellow: you will be paired with Batnairamdal
  Otgonshar. We will introduce you to your Fellow via email prior to the start
  of the program.

  First day of the AGF program on September 21 (Monday). Please save the date
  for our orientation day and we expect all SAs to join us. If you are unable to
  attend, please notify us as soon as possible.

  1. Welcome lunch at 12:15. Meet your designated Fellow and the rest of the
  cohort at the Asia Global Institute office (Room 326 to 348, Main Building,
  HKU).

  2. Campus tour at 13:30. SAs give the Fellows a tour of HKU. Recommended
  stops: libraries, canteens, banks on campus, supermarket within the Chong Yuet
  Ming Amenities Centre. Feel free to suggest other useful spots.

  Communication: a WhatsApp group for all SAs will be set up shortly.

  AGF events: SAs are encouraged to join lectures and company visits.
  Registration will be shared in the WhatsApp group on a first-come,
  first-served basis.

  Signed Joyce Yan, Senior Program Manager, Asia Global Institute, The
  University of Hong Kong. Contact details from the letter are omitted here.
spark: SA pairing with a sitting Mongolian MP is a hosting-and-learning job for
  eight weeks, not a prestige collectible. Learn from the public record; make
  Hong Kong low-friction; do not perform the biography.
