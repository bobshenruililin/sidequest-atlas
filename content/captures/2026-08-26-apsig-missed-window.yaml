title: APSIG 2026 is closed; build a draft-never-send radar, not an auto-apply robot
rawText: Instagram Scholarship Corner advertised APSIG Fellowship 2026 in
  Taipei. Help apply, and think whether Grok bots can crawl Scholarship Corner
  and auto-apply with our info. We want a system, not a one-off.
spark: An aggregator post is not an official call. The official APSIG page had
  already closed. Auto-apply would violate Opportunity OS. The miss should
  become a watchlist plus a send-never pipeline.
