triangulation:
  againstCanon:
    - Compounding over speed; a job is a rider on a decision already right
    - Never invent hire rates, deadlines, or award lumps
    - Prestige hunger is an advantage and a distortion field
    - Stay in GHD; medicine closed; thesis is HK trusted interface / heat-health
    - Grey-door closed
    - Calendar locks remain Fukuda 28 Aug 2026, term 1 Sep, October Laidlaw
      London plus GEST Valencia, winter LINK, summer 2027 Laidlaw LiA
    - Bots draft; Bob always submits
  informationGaps:
    - Current-day group JETS status; live careers.jardines.com HTTP 500; last
      primary capture 4 Jun 2025
    - Next DFI Future Retail Leaders intake dates
    - Whether GHD Year-3 field placement can sit in a Jardines operating company
    - Whether JEC healthcare or environmental teams hire non-engineers
    - Whether Hongkong Land still runs any Hong Kong graduate scheme not shown
      on the China-programme page
    - GHD congregation date; programme is 4-year as published
  opportunityGaps:
    - Named function vacancies in the final undergraduate year, only if the
      posting matches heat-health or trusted-interface work
    - DFI Future Retail Leaders is the only clearly any-degree graduate
      programme found today; it is retail, not CHP
    - Year-3 field placement as a thesis probe, host chosen for the problem not
      the house name
    - Summer 2028 internship only if the function matches; 2027 is LiA
  falseBargains:
    - Waiting for JETS to return
    - Applying to JEC management trainee or JEC summer intern as a GHD student
    - Applying to Gammon graduate training as a non-engineering graduate
    - Using DFI Summer Internship 2026 which is ending or Summer 2027 over LiA
    - Performing underrepresented status for DFI Diversity Student Initiative
    - Treating Foundation scholar and group employee as the same win
    - Leaving GHD or chasing an engineering shape to wear the house name
    - Inventing a hire percentage
  corrections:
    - After graduation you enter a named legal entity, not a group JETS class
    - JEC management trainee and summer intern require engineering disciplines
    - Gammon graduate training is for engineering and geological graduates
    - Hongkong Land's published graduate scheme on the fetched page is China
    - DFI Future Retail Leaders accepts any bachelor and is off-thesis unless
      chosen as a retail career
    - DFI Summer Internship 2026 is dated 1 Jun to 28 Aug 2026
    - Avature snapshot on 26 Aug 2026 had no Hong Kong graduate-trainee posting
    - GHD is a 4-year BASc; field placement is at the end of Year 3
  suggestedImplementations:
