title: Jardine is six named objects; no live matching door and no published percentage
rawText: Can I realistically get into Jardine? Any routes? Percentage? Discuss
  with Fable and Sol and give a report.
spark: Prestige hunger collapsed six Jardine objects into one admit chance.
  Year-2 GHD with Tung and Ngai and a stable family has no live matching form.
  Fable refuses a percentage. Sol calls the postgraduate route a serious reach,
  not an expected win.
