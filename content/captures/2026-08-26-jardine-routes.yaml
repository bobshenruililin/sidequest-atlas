triangulation:
  againstCanon:
    - Compounding over speed; do not spray ineligible forms to look busy
    - A scholarship is a rider on a decision already right, never the reason for
      the decision
    - Never invent deadlines, fares, hours, award lumps, or admit rates
    - Prestige hunger is an advantage and a distortion field
    - Stay in GHD; medicine closed; thesis is HK trusted interface / heat-health
      / CHP-China CDC as an aim not an offer
    - Family capital is stable; do not perform poverty for need-aware awards
    - Tung and Ngai already funds tuition and living; concurrent-award clause
      unread except the public eligibility page
    - Grey-door closed
    - Calendar locks remain Fukuda 28 Aug 2026, term 1 Sep, October Laidlaw
      London plus GEST Valencia, winter LINK, summer 2027 Laidlaw LiA
    - Bots draft; Bob always submits
  informationGaps:
    - First-party Foundation HTML for the UG Oxbridge shutdown was
      challenge-walled on 26 Aug 2026; THE and SCMP attribute the line to the
      Foundation
    - Combined Oxford plus Cambridge postgraduate award count is unpublished;
      Cambridge Trust prints approximately 5 for 2026/27 Cambridge-side only
    - AAS card 705 conflicts TEN versus FIFTEEN new entrance awards
    - Sir Man Kam Lo and Ho Tung cards last updated 2022; 2025-26 dates on the
      cards are stale
    - Careers students page returned HTTP 500; JETS-closed claim rests on cached
      extracts plus secondary press
    - Tung and Ngai award-letter wording on postgraduate overseas flexibility
      versus the two-year HK or Mainland residence commitment
    - GHD normative length and therefore the first honest Oxbridge postgraduate
      entry year
    - Whether a future Asia-university Foundation undergraduate scheme would
      ever apply to a continuing HKU student
  opportunityGaps:
    - The only remaining object that still says Jardine Scholar in the Oxbridge
      sense is postgraduate college nomination after a real Oxford or Cambridge
      offer, years from now
    - Youde local nomination and a cleaned General Round already occupy the live
      prestige queue this month
    - Portfolio-company internships later, only if a named function matches
      heat-health rather than the house name
  falseBargains:
    - Inventing an admit percentage from stock counts or aggregator copy
    - Using the UCAS Foundation portal as a Year-2 side door
    - Ticking Sir Man Kam Lo/Jardine or Jardine Ho Tung because General Round is
      one form
    - Need theatre for the Jardine HKU entrance scholarship
    - Treating JETS, Bright Network, or Rare Talent copy as live
    - Oxford or Cambridge as a prestige patch that is not the heat-health seam
    - Youde overseas on 4 Sep 2026 because the word scholarship felt adjacent
    - Hiding Tung and Ngai from later Foundation or General Round declarations
  corrections:
    - Jardine is six named objects under four brands; they do not share a form,
      faculty, or calendar
    - "Fable: five doors no; postgraduate Oxbridge is conditional yes after a
      real offer in the final undergraduate year; zero Jardine actions this
      week"
    - "Sol: do not make Jardine a primary objective; postgraduate is a serious
      reach; a percentage is unjustified; only chase a firm seat if a named
      function actually fits the thesis"
    - GHD normative length is unpublished here; do not lock a 2028 or 2029
      application year as fact
    - Foundation undergraduate Oxbridge is the wrong life-stage and, per THE 7
      Aug 2026 and SCMP 2 Aug 2026, the final cohort is autumn 2026 starters
    - Foundation postgraduate Oxbridge continues via partner colleges after a
      provisional offer; 2026 Magdalene and Queen’s clocks are already dead
    - From 2027, Queen’s requires first-preference college for its Jardine route
    - Jardine HKU Scholarship deadline 5 Aug 2026; Year 1; need-aware
    - General Round 2026-27 lists Sir Man Kam Lo/Jardine and Jardine Ho Tung;
      GHD matches neither faculty line
    - THE 50-scholarships-a-year line does not reconcile with 600-plus over
      40-plus years; do not use it as a quota
    - Cambridge Trust approximately 5 is a count, not a percentage
    - No published acceptance rate exists
  suggestedImplementations:
    - action: Do not apply to any Jardine object this week; finish Youde local
        nomination and the cleaned General Round
      rationale: No live matching door; those two already occupy the prestige queue
      effort: S
      leverage: high
      owner: bob
    - action: On the General Round form, do not count on Sir Man Kam Lo/Jardine or
        Jardine Ho Tung
      rationale: Faculty and major mismatch; one form is not a waiver
      effort: S
      leverage: high
      owner: bob
    - action: In the final undergraduate year, reverify on college and Foundation
        pages that postgraduate Oxbridge still continues, then choose course and
        supervisor before naming a partner college
      rationale: Today's partner list and Queen's first-preference rule will be stale
        by then; Fable filed this as a tripwire not a 2026 form
      effort: S
      leverage: high
      owner: shared
    - action: Before any postgraduate Jardine file, read the Tung and Ngai letter on
        overseas postgraduate flexibility and concurrent awards
      rationale: Public eligibility copy is not the letter
      effort: S
      leverage: high
      owner: bob
    - action: Watch portfolio-company careers later; do not hunt a group JETS
      rationale: Formal group graduate and internship programmes are no longer in place
      effort: S
      leverage: low
      owner: bob
    - action: Keep Foundation and college enquiry addresses on official PDFs, not in
        public captures
      rationale: Privacy scan flags emails in content/
      effort: S
      leverage: low
      owner: agent
