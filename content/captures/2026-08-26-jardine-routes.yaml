title: Jardine has one live door for Bob and it opens in 2028, not this week
rawText: "Can he realistically get into Jardine? Routes? Percentage? Objects on
  the table: Jardine Foundation UG Oxbridge, Jardine Foundation PG Oxbridge,
  Jardine HKU entrance scholarship, Sir Man Kam Lo/Jardine General Round
  ss_id=242, Jardine Ho Tung ss_id=478, Jardine Matheson JETS graduate scheme."
spark: Jardine is six different objects wearing one brand. Five are closed,
  ineligible, or dead. The sixth is a postgraduate fork that only opens after an
  Oxford or Cambridge offer, years from now, and only compounds if the course
  serves the heat-health thesis rather than the colonial-brand itch.
