title: Leopold Lind comparison — per-axis verdicts, no leaderboard, no twinning
rawText: 'Bob asked, one week after the Jardine scholar doors were judged closed
  for this life-stage and with a "join Jardines after graduation" goal on the
  board: "Can I exceed him? Do I currently? How:" plus the LinkedIn URL of
  Leopold Lind (Tsinghua PPE, Deloitte consulting intern, VC investing intern,
  co-founder title at Commorai.com, China Daily byline). Explicitly not a /goal;
  treated as a /compound comparison.'
spark: A prestige-duel request arriving the same week a prestige door closed is
  a distortion-field event, not a research question. The useful object is not a
  ranking but a per-axis map of what Leopold's path reveals about corridors and
  artifact types, and what it does not.
