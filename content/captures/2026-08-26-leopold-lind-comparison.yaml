triangulation:
  againstCanon:
    - Doctrine bans single scores and invented percentages; comparison is
      per-axis only
    - Prestige hunger is an advantage AND a distortion field; this request is
      the field firing one week after Jardine scholar doors closed
    - A scholarship, job, or person is a rider on a decision already right;
      Leopold is a rider on Bob's already-made GHD/HK-interface decision only
      insofar as he reveals corridor structure
    - Binding this week, not reopened here — Jardine scholar closed for this
      life-stage; Jardine group after graduation means named legal entities, not
      JETS; DFI FRLP twins the house by default
    - Evidence confidence is layered — CISS bio and China Daily byline are high
      confidence; Xinya College is medium (live URL 403); all LinkedIn self-copy
      is low confidence, including the LLB label (treat as label error), the
      Fortune Ventures vs Fortune Capital vs 达晨财智 identity mismatch (do not
      collapse into a verified 达晨 internship), the SEM incubator metrics, and
      Commorai marketing numbers
    - Leopold is co-founder at Commorai on LinkedIn; a separate public profile
      names a Founder and CEO — a title in someone else's shop, not proof he
      built the company
    - No evidence Leopold is a Jardine Scholar
  informationGaps:
    - Live LinkedIn profile not fetched (HTTP failed / rate-limited); everything
      self-reported stays low confidence
    - Which fund the VC internship was actually at remains unresolved
    - Whether Leopold has any verified scholarship or supervised research output
      — none found
    - Bob's CGPA 4.09/4.30 still operator-stated, not SIS-checked
  opportunityGaps:
    - The one transferable Leopold signal is artifact type, not path — a
      verified public byline tied to fieldwork (China Daily piece) is a
      cheap-to-copy artifact class Bob lacks; Bob's near lever is already booked
      (GEST Valencia invited talk) plus one written output from Nordic fieldwork
      or Laidlaw, no new lane required
    - Bob's defensible axes — verified selective awards (T&N 1 of 4, Laidlaw,
      Martin, Horizons), supervised research with Bishai, technical stack
      (Python/R/C++, GraphCast, quantum), Cantonese-Mandarin-English plus HKSAR
      PR on the HK corridor — are axes Leopold shows no play on
    - Exceed is only meaningful per gatekeeper and per thesis — pick the surface
      (a named 2029-30 hiring desk, compounding rate on own thesis, or
      verification density) before comparing at all
    - Sol — HK–Nordic–China health governance is the triangle to build, not
      imitation Germany; the moat is usefulness inside HK health institutions
  falseBargains:
    - Deloitte spray — collecting brand internships to match a logo count when
      the internship is not on the heat-health / HK-interface corridor
    - Commorai clone — co-founding an AI-data shop to earn a Building X.com
      headline; Bob has no venture thesis and needs none this year
    - TEDx theater — licensee optics and speaking-title accumulation as a
      substitute for one verified artifact
    - Abandoning GHD for a Tsinghua-shaped PPE-consulting-VC identity; medicine
      is closed, GHD is the decision already made
    - Treating Leopold's LinkedIn collage as a verified record and twinning it —
      parts dissolved under checking (fund identity, LLB label, stale freshman
      life-stage, unverified metrics)
    - Letting a closed Jardine door convert into a proxy prestige duel with a
      stranger who will never sit on the same shortlist
    - Sacrificing Laidlaw quality, GPA, or faculty trust for another branded line
    - Performing China-Europe with short visits and forums
    - Editing LinkedIn this week to answer him
  corrections:
    - Do not flatter — on brand optics for a mainland or European consulting-VC
      screen, Tsinghua PPE plus Deloitte plus a VC internship reads stronger
      today than HKU GHD Year 2, and Laidlaw does not neutralize that; Bob loses
      on Leopold's board and should not play on it
    - "Sol: today Bob does not exceed him across the board; the one current win
      is HK-local scholar and service lock; potential is not an artefact"
    - Call on research — Fable scored supervised research as a current win; Sol
      scored structure without a finished object; adopt Sol; setup is ahead,
      artefact is not
    - On verification density Bob is ahead — his record is letter-backed and
      survives triangulation; a meaningful part of Leopold's collage is
      low-confidence self-copy
    - "Fable corrected question: which single verified artefact in the next 12
      months most raises the value of my thesis to the people who decide my
      2029-30 doors — and what artefact type does Leopold's path reveal that I
      am missing"
    - Answer to the revealed-artefact-type question — a public byline tied to
      real fieldwork; everything else in the collage is either off-thesis or
      unverified
    - "Sol corrected question: what evidence must I compound by 2029 so that HK
      health institutions trust me with problems neither a generic prestige
      candidate nor a profile-stack founder can handle"
    - Do not use class of 2027 — search mixed a different Leo Lindberg
    - Fortune Capital headline versus Fortune Ventures Maple Valley company card
      versus unnamed CISS domestic top VC remains unresolved; not a verified 达晨
      internship
    - Xinya College is a 403'd news extract, not a CISS fact
