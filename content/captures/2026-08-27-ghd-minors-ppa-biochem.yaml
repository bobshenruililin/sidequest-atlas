      owner: bob
    - action: At Fukuda sharing Fri 28 Aug, ask how minors sequence against the
        6-month capstone placement
      rationale: Placement window constrains any advanced-course ladder
      effort: S
      leverage: high
      owner: bob
    - action: After the IB transcript, take BIOC1600 as a single free elective only in
        a later GPA-safe semester if the thesis needs lab methods — probe, not
