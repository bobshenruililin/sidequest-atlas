triangulation:
  againstCanon:
    - Floor test 2026-07-22 — medicine without surgery is no; medicine closed
      unless real clinical exposure and the floor changes
    - Ordinary law without Magic Circle is acceptable; JD framed in T&N
      materials as a regulatory tool only if asked
    - Thesis is HK as trusted interface, heat-health, CHP-China CDC aim
    - T&N public renewal needs yearly GPA at least 3.50 or equivalent
    - GHD 2025-26 intake has 84 elective credits; PPA 36 plus biochem 36 leaves
      12; double-counting not allowed for double-minors; incomplete minor
      becomes free electives not on transcript
    - HKU JD regs 2026-27 want a non-law bachelor with at least second class
      honours; expected 2:1 or equivalent; no minor requirement; LSAT encouraged
      not mandatory
    - MBBS-GE official page shows a 4-year track with quota 25; honours degree;
      admission requirements in Chinese, English and science subjects such as
      chemistry or biology; Chinese proficiency; no published GPA cutoff, no
      published biochem-minor requirement
    - The roughly 300 degree-holder applications figure was for the six-year
      MBBS, not a GE denominator — never turned into a rate
    - BIOC1600 prereq is HKDSE L3 Biology, Chemistry, or Combined Science or
      equivalent; BIOC1600 and BIOC2600 both run 2026-27 first semester, so
      BIOC2600 cannot be the same semester as a first BIOC1600; biochem is a
      sequenced ladder colliding with Year-3 placement and summer 2027 LiA
    - Bob's IB science subjects are unknown in canon (IB 41, English A 7,
      Chinese A 6 known); do not invent chemistry HL
  informationGaps:
    - Bob's IB science subjects and levels — decides BIOC1600 eligibility and
      whether MBBS-GE science-subject university admission requirements are
      satisfiable; pull the IB transcript and record in canon
    - Whether GHD 2025-26 electives are 84 (ghd.sph overview) or 90 (older SPH
      page) in the Faculty syllabus that actually binds this cohort
    - POLI1003 semester capacity and enrolment window for this term
    - Overlap and double-counting between the Faculty of Social Sciences PPA
      minor and GHD's in-curriculum Global Development in Asia minor (POLI2106,
      POLI3080, GHAD2002)
    - How minors sequence against the 6-month capstone placement — ask at the
      Fukuda GHD sharing Fri 28 Aug 2026
    - MBBS-GE published requirements for Bob's actual cycle (~2029) — the
      2026/27 documents are too early to bind him
  opportunityGaps:
    - PPA compounds the governance thesis directly — POLI2108 public
      administration, POLI3035 PA in HK, POLI3064/LLAW3080 governance and law
      are the coursework version of trusted-interface work and support the
      JD-as-regulatory-tool framing
    - After the IB check, one BIOC1600 as a free elective in a later GPA-safe
      semester is a probe at one-sixth the cost of a declared minor, and only if
      the thesis needs lab methods; incomplete-minor rules mean declaring early
      buys nothing
    - Keeping 48 elective credits free after PPA preserves exchange, thesis
      electives, and placement flexibility
  falseBargains:
    - 36 biochem credits as a hedge on a door the 2026-07-22 floor test closed —
      a minor is not clinical exposure and cannot reopen medicine on Bob's own
      stated terms
    - Turning roughly 300 six-year-MBBS applications into a GE admit rate
    - Treating PPA as a JD admissions ticket — the JD reads honours class and
      GPA, not minors
    - Both minors at 72 of 84 credits — paper-feasible, not livable against
      placement, LiA, and the 3.50 renewal floor
    - Declaring biochem to keep options open when an undeclared BIOC1600
      elective preserves the identical option
    - Enrolling BIOC1600 in 2026-27 first semester as a med hedge during Fukuda,
      term start, Youde local, and General Round
  corrections:
    - PPA is right, and it is right because it compounds the thesis already
      chosen, not because law or medicine admissions read minors
    - Should help for med is the distortion tell — biochem here is identity
      insurance on the doctor story, premium paid in GPA risk to T&N, the asset
      actually compounding; quota 25 reads as elite scarcity to prestige hunger
    - "Fable corrected question: which use of 84 elective credits best compounds
      the thesis while keeping every yearly GPA at or above 3.50 — not which
      minor helps med or law"
    - "Sol corrected question: which Year-2 choices strengthen the GHD thesis,
      GPA, and HK health-governance position, while generating enough real
      evidence to decide later between ordinary law and a genuinely reopened
      medical route"
    - Call on BIOC1600 — Fable allows a later free-elective probe; Sol blocks
      speculative enrolment until IB sciences are known; no BIOC1600 this week
      or this first semester; a later single elective only for thesis methods,
      not as a med hedge; do not declare the minor to keep the option
    - Do not convert CGPA 4.09/4.30 to a 4.0 scale for JD expected-language
      comparisons
    - HKU JD regulations say at least second class honours; the admissions page
      expected language is upper second / 3.3 of 4.0 — those are different
      sentences; neither is a published admit rate
