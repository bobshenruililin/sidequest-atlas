title: Year-2 mix is 3 PPA plus BIOC1600 if the Y3 ladder is real; not a dual minor
rawText: Bob (27 Aug 2026), thinking of medical school or law school later. With
  GHD plus Tung and Ngai plus Martin plus Laidlaw, would a minor in PPA or
  biochemistry, or both, help? Definitely doing PPA. Thinking hard about
  biochem, quote, Should help for med but it is quite challenging.
spark: Morning memo answered dual-minor declaration and overweighted T&N 3.50.
  Afternoon correction — the live object is 4 PPA versus 3 PPA plus one BIOC in
  Year 2, to keep a Year-3 biochemistry ladder. IB Chemistry HL 6, Physics HL,
  no Biology.
