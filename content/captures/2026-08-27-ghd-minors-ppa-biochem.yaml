title: PPA minor yes for the thesis; biochem minor is medicine re-entering
  through the elective budget
rawText: Bob (27 Aug 2026), thinking of medical school or law school later. With
  GHD plus Tung and Ngai plus Martin plus Laidlaw, would a minor in PPA or
  biochemistry, or both, help? Definitely doing PPA. Thinking hard about
  biochem, quote, Should help for med but it is quite challenging.
spark: Minor selection for Year 2 is a 36-to-72-credit allocation of the
  84-credit elective budget, colliding with T&N yearly GPA 3.50 renewal, Year-3
  capstone placement, and the closed-medicine floor test.
