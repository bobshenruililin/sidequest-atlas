title: Practise-in-HK is MCHK, not collecting an MD; local GE first
rawText: Given family investable assets, a saleable property, a primary home,
  and yearly saving, I do have the financial means to do further studies.
  Thinking of whether I am able to do an MD somewhere so to practise medicine in
  HK, and likely financial situation versus typical doctors of my age. Give as
  many options of pursuing MD or doctor qualifications as possible. Australia?
  UK? Canada? HK? Prices? Will I come ahead in the end even if I have a primary
  degree in global health?
spark: Family capital is enough to fund further study. The live object is
  practise rights in Hong Kong, not an MD title. Floor test 22 Jul 2026 still
  closed medicine without surgery unless intern rotations including surgery
  become wanted.
