title: Life-as-portfolio essay is 看懂持仓, not 不断调仓
rawText: |-
  Analyze mine.

  人从出生开始，其实就已经有仓位了
  出生家庭，是你的初始资本。
  出生城市，是你天然暴露的市场 Beta。
  父母买学区房，是加杠杆做多教育；
  从小报一堆兴趣班，是早期 VC 撒网，十个项目里赌一个爆款。
  高考选专业，是买入一只至少锁仓四年的行业 ETF。
  选错赛道，毕业的时候可能刚好赶上行业熊市；
  选对赛道，相当于在产业周期启动前拿到了低成本筹码。
  找工作，其实是在选成长股。
  进对公司，比一开始多拿那几千块工资重要得多。
  你加入一家高速增长的公司，本质上是在用自己的时间和职业生涯，做多它未来几年的增长。

  公司涨，你的职位、薪资、人脉、认知一起涨。
  公司跌，哪怕你能力没变，也可能被行业 Beta 一起拖下去。
  所以跳槽，本质上也是调仓。
  有人频繁追涨杀跌，有人拿着一只十倍股很多年。
  买房，是人生里最大的一笔杠杆交易之一。
  首付是本金，房贷是融资，城市是标的，职业收入是保证金。

  结婚就更有意思了。

  它不只是“两张资产负债表合并”，更像是选择一个长期合伙人，共同经营一家无限存续期公司。
  你选的不只是对方现在有多少钱，
  还包括他的性格、信用、消费习惯、家庭背景、抗风险能力，以及未来二三十年的现金流创造能力。

  好的婚姻是并购以后产生协同效应，1+1>2；
  坏的婚姻，则可能是一次带着无限连带责任的灾难性并购。
  生孩子，是一只封闭期二十年以上、持续追加资本、无法提前赎回的基金。
  不保本，不承诺收益，但很多人依然愿意把人生最宝贵的时间和现金流定投进去。

  甚至健康也是仓位。年轻的时候疯狂透支身体，相当于不断从未来借钱；睡眠、运动、饮食，则是在给自己最重要的生产性资产做 CapEx。

  养老金，则是你用几十年的现金流，去做多未来的国家信用、人口结构和社会制度。

  所以这个世界根本不存在所谓的“我不投资”。你不买股票，不代表你没有仓位。

  你的城市、专业、职业、公司、房子、婚姻、孩子、健康，全部都是仓位。

  真正的区别只是：
  有些仓位是你主动选的，
  有些仓位，是默认配置给你的。

  而人生最重要的能力之一，就是尽早看懂自己的持仓，然后不断调仓。
