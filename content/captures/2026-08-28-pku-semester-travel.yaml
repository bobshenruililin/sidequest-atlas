title: PKU spring exchange travel windows
rawText: "When exchanging at PKU, is there time to travel in the semester?
  Academic pressure? How many weeks? Staycations in Beijing versus leaving
  the city? Living budget is not the scarce input."
spark: A PKU spring semester has about 1.5–2 fragmented in-term travel weeks
  plus a fat winter gap before report and a thin post-exam sliver. Pressure is
  course diet, not Beida mystique. Beijing staycation is the load-bearing
  memory. Analog calendars only; 2027/28 unpublished.
