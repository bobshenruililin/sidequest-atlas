title: Tsinghua hides GPA rank; AI-paper lottery is the substitute filter
rawText: 'Bob pasted two Mainland-web artifacts and asked for text plus
  implications for us. Artifact A: a commentary predicting an undergraduate "AI
  thesis lottery." Rankings exist because good slots are scarce, not because a
  ranking board causes scramble. Killing visible GPA rank does not end
  competition; it moves the contest to lab seats, packaged papers, and
  recommendation letters, then fills the vacuum with junk signals. Artifact B: a
  Xiaohongshu photo of Tsinghua slide 28, title "GPA is not the only pursuit,"
  listing six measures (stop providing/using GPA rank; drop the 80% 推免 floor for
  comprehensive evaluation; add categorized "highlight work" uploads; link
  admission-training-employment quotas; expand honors including 三好学生; weaken
  rank in scholarship review). Comment under the slide: the background is not
  more 保研 seats but fewer and lower-quality ones; treehole worse than expected;
  verdict "Q 宝, when will the lemon ripen." Treat the slide as a circulating
  screenshot, not a gazetted circular. Do not copy it onto HKU. Grey-door stays
  closed.'
spark: Turning off the ranking TV does not create slots. For an HKU stack
  already on named awards, letters, and fieldwork, the expensive hidden contest
  is already the board; AI-paper volume is a false bargain.
