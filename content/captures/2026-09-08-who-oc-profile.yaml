title: Missing GHD Youth Programme Committee for WHS RM 2027 is not a profile hole
rawText: Is not getting spot at organising committee of WHO regional meeting
  detrimental to my profile? Follow-up named the object as the BASc(GHD) Youth
  Programme Committee for the World Health Summit Regional Meeting hosted at
  HKU. GHD office circular stated 7-9 May 2027, Faculty asked GHD students to
  participate substantively, Director and Deputy Director interview, interest
  deadline Friday 7 August 2026. That deadline is past. This is World Health
  Summit, not WHO.
spark: A missed GHD youth-programming title for a home WHS Regional Meeting is
  being read as damage. It is a closer miss than IFMSA or a WHO RC, still not a
  hole. Do not late-submit.
