triangulation:
  againstCanon:
    - Compounding over speed; prestige hunger is a distortion field
    - Thesis is HK as trusted interface / heat-health / CHP-China CDC aim
    - Medicine without surgery is closed; GHD is not MBBS
    - Youde CV already keeps World Health Summit off until confirmed
    - Load-bearing nouns are Tung and Ngai, Laidlaw plus Bishai, Martin, WZQ
      coordinator, NEWDAY, GEST invited speaker
    - Calendar — term started 1 Sep 2026; October Laidlaw London attending plus
      GEST Valencia invited speaker; Youde or General Round Year-2 close noon 24
      Sep 2026 if still unsent
    - Leadership in voice is connection and translation, not title collection
    - WHS Berlin 2025 already occupies the WHS memory slot
    - WHS is not WHO; HKU hosts the 2027 Regional Meeting as Academic Alliance
      International Presidency (Lau listed as 2027 International President on
      WHS.org, accessed 8 Sep 2026)
  informationGaps:
    - Applied versus missed the 7 Aug 2026 deadline versus interviewed versus
      waitlist; treated as out as of 8 Sep 2026
    - Whether any named 2026-27 door listed this committee as a prerequisite
    - Whether GHD will later open volunteer or attendee paths for May 2027
    - 7-9 May 2027 remains programme-office dates, not WHS.org-published
  opportunityGaps:
    - Laidlaw written comments and GHD sequencing still compound
    - WZQ coordinator already is organising-ability with field consequence
    - October talks are the live public-health rooms
    - Home hosting still happens without this committee seat
  falseBargains:
    - Relabelling a WHS youth committee as a WHO organising-committee miss
    - Late-submitting the August Qualtrics form
    - Emailing the Directors to ask why or bargain onto the roster
    - Putting almost-selected or WHS RM 2027 on the Youde CV
    - Replacing Laidlaw artefact time with a consolation committee
    - Treating non-selection as a GHD faculty veto
  corrections:
    - Not detrimental to this profile; closer miss, not a bigger hole
    - Object is GHD Youth Programme Committee for WHS RM 2027 at HKU, not WHO
      Regional Committee and not IFMSA
    - Interest deadline Friday 7 August 2026 is past; do not submit
    - Fable question — which work this semester evidences the thesis
    - Sol question — did this committee gate a named door, yes or no? No
